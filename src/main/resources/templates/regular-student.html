<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: DejaVu Sans, sans-serif; margin: 40px; }
    .title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 30px; }
    .content { font-size: 14px; line-height: 1.5; margin-bottom: 60px; }
    .signature { margin-top: 60px; text-align: right; }
    .line { margin-top: 40px; border-top: 1px solid #000; width: 250px; text-align: center; float: right; }
  </style>
</head>
<body>
  <div class="title">Confirmation of Student Status</div>

  <div class="content">
    This is to certify that <b th:text="${name}"></b>, index number 
    <b th:text="${indexNumber}"></b>, is a regular student of this university,
    currently enrolled in study year <b th:text="${studyYear}"></b>.
  </div>

  <div class="signature">
    <div class="line"></div>
    <div>Student Administration </div>
  </div>
</body>
</html>
